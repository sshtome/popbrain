name: Build Binaries (Wheels)

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build_windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    env:
      DISTUTILS_USE_SDK: '1'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'

      - name: Install PyTorch and Build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools ninja
          pip install torch --index-url https://download.pytorch.org/whl/cu121

      - name: Build Wheel (AOT Compilation)
        env:
          BUILD_CUDA_EXT: '1'
          DISTUTILS_USE_SDK: '1'
        run: python setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: popbrain-win64-py${{ matrix.python-version }}
          path: dist/*.whl

  build_linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    env:
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.1.0'
          linux-local-args: '["--toolkit", "--override"]'

      - name: Install PyTorch and Build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools ninja
          pip install torch --index-url https://download.pytorch.org/whl/cu121

      - name: Build Wheel (AOT Compilation)
        env:
          BUILD_CUDA_EXT: '1'
        run: python setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: popbrain-linux-py${{ matrix.python-version }}
          path: dist/*.whl
